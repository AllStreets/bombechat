name: CI

on:
  push:
  pull_request:

jobs:
  # bluetooth/ (the Bluetooth edition) must be exactly what the sync script
  # writes from the root and bluetooth/edition/, and the script is tested.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync script tests
        run: bash tools/test-sync-bluetooth.sh

      - name: bluetooth/ is in sync with the root
        run: bash tools/sync-bluetooth.sh --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA for the modem, OpenSSL for SQLCipher, WebKitGTK and friends for
      # the Tauri shell (app/src-tauri), as Tauri's Linux prerequisites list.
      - name: Install system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libssl-dev pkg-config build-essential
          libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Airgapped check (positive, must pass)
        run: bash tools/check-airgapped.sh

      - name: Airgapped check (negative, must fail)
        run: |
          if CHECK_FEATURES=bluetooth bash tools/check-airgapped.sh; then
            echo "expected the bluetooth-featured check to fail, but it passed" >&2
            exit 1
          fi

  # The same on a Mac, where the lock can come off and the store key is kept
  # in the Keychain: the Keychain paths in app/src-tauri/tests/device.rs only
  # run here. CoreAudio and the system frameworks come with the runner.
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Airgapped check (positive, must pass)
        run: bash tools/check-airgapped.sh

      - name: Airgapped check (negative, must fail)
        run: |
          if CHECK_FEATURES=bluetooth bash tools/check-airgapped.sh; then
            echo "expected the bluetooth-featured check to fail, but it passed" >&2
            exit 1
          fi

      # The Bluetooth edition is its own workspace, built into bluetooth/target.
      - name: Cache cargo (Bluetooth edition)
        uses: actions/cache@v4
        with:
          path: bluetooth/target
          key: ${{ runner.os }}-cargo-bluetooth-${{ hashFiles('bluetooth/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bluetooth-

      # bluetooth/Cargo.lock is the edition's own (the sync never writes it);
      # --locked fails if it no longer matches the edition's manifests.
      - name: cargo test --workspace --locked (Bluetooth edition)
        run: cd bluetooth && cargo test --workspace --locked

  # Note: `npm run check:front` and `npm run check:settings` need a GPU-backed
  # Chrome to render the WebGL/Metal interface and are not run here; see the
  # README "Checks" section. They stay a local gate, in bluetooth/ too.
