name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA for the modem, OpenSSL for SQLCipher, WebKitGTK and friends for
      # the Tauri shell (app/src-tauri), as Tauri's Linux prerequisites list.
      - name: Install system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libssl-dev pkg-config build-essential
          libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Airgapped check (positive, must pass)
        run: bash tools/check-airgapped.sh

      - name: Airgapped check (negative, must fail)
        run: |
          if CHECK_FEATURES=bluetooth bash tools/check-airgapped.sh; then
            echo "expected the bluetooth-featured check to fail, but it passed" >&2
            exit 1
          fi

  # Note: `npm run check:front` and `npm run check:settings` need a GPU-backed
  # Chrome to render the WebGL/Metal interface and are not run here; see the
  # README "Checks" section. They stay a local gate.
