<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bombechat, the back of the machine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="fonts/marcellus-sc.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="edition.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<style>
:root{
  --enamel:#1b1c1a; --plate-ink:#ece6d6;
  --buff:#eadfc4; --green-ink:#2f5a4b; --type-ink:#25211b; --muted:#6b6150;
  --brass:#b8955c; --amber:#e7a63c;
  --engr:'Bombechat Engraving',Georgia,serif;
  --print:'Libre Caslon Text',Georgia,serif;
  --type:'Cutive Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0b0a;color:var(--plate-ink)}
body{-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:46px minmax(0,1fr);height:100vh;overflow:hidden}

/* top bar, same language as the front */
.top{display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(#20211f,#181917);box-shadow:inset 0 -1px 0 #000,0 1px 0 rgba(255,255,255,.04);position:relative;z-index:5}
.maker{font-family:var(--engr);font-size:15px;letter-spacing:.12em;color:#d9d2bf}
.maker small{font-size:12px;letter-spacing:.08em;color:#8d887a;margin-left:10px}
.maker small::after{content:var(--build)}
.pl{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(#141413,#0b0b0a);color:var(--plate-ink);font-family:var(--engr);font-size:12px;letter-spacing:.06em;
  padding:4px 12px 3px;border-radius:1.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.05),0 -1px 0 rgba(0,0,0,.6);white-space:nowrap}
a.pl,button.pl{all:unset;display:inline-flex;align-items:center;gap:9px;background:linear-gradient(#171716,#0b0b0a);color:var(--plate-ink);font-family:var(--engr);font-size:12px;letter-spacing:.06em;
  padding:5px 12px 4px;border-radius:1.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.05),0 2px 0 #000;cursor:pointer;transition:transform .08s,box-shadow .08s}
a.pl:hover,button.pl:hover{box-shadow:inset 0 0 0 1px rgba(231,166,60,.5),0 1px 0 rgba(255,255,255,.05),0 2px 0 #000}
a.pl:active,button.pl:active{transform:translateY(1px);box-shadow:inset 0 0 0 1px rgba(231,166,60,.5),0 1px 0 #000}
a.pl:focus-visible,button.pl:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
a.pl svg{display:block}
.top .rt{margin-left:auto;display:flex;gap:10px;align-items:center}
.maker,.pl,a.pl,button.pl{-webkit-text-stroke:.25px currentColor}
.saved{font-family:var(--type);font-size:12.5px;color:#9d978a;min-width:150px;text-align:right;transition:opacity .4s}

.stage{display:grid;grid-template-columns:minmax(380px,440px) minmax(0,1fr);min-height:0;background:var(--enamel)}

/* wiring schedule card */
.cardwrap{min-height:0;padding:16px 0 16px 16px;display:flex}
.card{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--buff);color:var(--type-ink);border-radius:1px;
  box-shadow:0 10px 24px rgba(0,0,0,.55),0 2px 3px rgba(0,0,0,.5);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .09 0'/></filter><rect width='300' height='300' filter='url(%23p)'/></svg>")}
.card-h{padding:16px 22px 8px;border-bottom:1.5px solid var(--green-ink);display:flex;justify-content:space-between;align-items:flex-end;color:var(--green-ink)}
.card-h h1{font-family:var(--print);font-weight:400;font-size:21px}
.card-h span{font-family:var(--print);font-size:12px}
.card-h span b{font-family:var(--type);font-weight:400;font-size:14px;color:var(--type-ink);margin-left:4px}
.sched{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 22px 24px;scrollbar-width:thin;scrollbar-color:rgba(75,74,71,.55) transparent}
.sched::-webkit-scrollbar{width:8px}.sched::-webkit-scrollbar-thumb{background:rgba(75,74,71,.45);border-radius:4px;border:2px solid var(--buff)}
.grp{position:sticky;top:0;z-index:2;background:var(--buff);box-shadow:-8px 0 0 var(--buff),8px 0 0 var(--buff);font-family:var(--print);font-size:13px;color:var(--green-ink);padding:14px 0 5px;border-bottom:1px solid var(--green-ink);display:flex;justify-content:space-between}
.grp small{font-family:var(--type);font-size:12px;color:var(--muted)}
.row{position:relative;padding:10px 8px 11px;margin:0 -8px;border-bottom:1px solid rgba(47,90,75,.3);border-radius:1px;transition:background .2s}
.row:hover,.row.focus{background:rgba(47,90,75,.06)}
.row.active{background:rgba(231,166,60,.12)}
.row .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row .nm{font-family:var(--print);font-size:15px;color:var(--type-ink)}
.row .val{font-family:var(--type);font-size:14px;color:var(--type-ink);white-space:nowrap}
.row .desc{font-family:var(--type);font-size:12.5px;line-height:1.45;color:var(--muted);max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s,margin .25s}
.row.focus .desc,.row.active .desc{max-height:60px;opacity:1;margin-top:5px}
.jacks{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.jacks.wide{column-gap:14px}
.jk{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:34px;padding:2px 2px 0;border-radius:2px}
.jk i{width:18px;height:18px;border-radius:50%;display:block;position:relative;
  background:radial-gradient(circle at 50% 50%,#0f0e0c 0 5px,transparent 5.5px),radial-gradient(circle at 38% 32%,#f0dcae,#b8955c 55%,#6e5631);
  box-shadow:0 1px 1px rgba(60,40,10,.4),inset 0 0 0 .5px rgba(0,0,0,.4)}
.jk span{font-family:var(--type);font-size:12px;color:var(--muted);white-space:nowrap}
.jk[aria-checked="true"] i::after{content:"";position:absolute;inset:-2px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#c9a465 0 3px,transparent 3.5px),radial-gradient(circle at 38% 30%,#4a4640,#141311 60%,#050505);box-shadow:0 2px 3px rgba(0,0,0,.45);
  animation:seat .22s cubic-bezier(.3,1.5,.5,1)}
@keyframes seat{from{transform:scale(1.35);opacity:.2}to{transform:scale(1);opacity:1}}
.jk[aria-checked="true"] span{color:var(--type-ink)}
.jk:hover i{box-shadow:0 1px 1px rgba(60,40,10,.4),0 0 0 2px rgba(47,90,75,.35)}
.jk:focus-visible{outline:1px solid var(--green-ink);outline-offset:2px}
/* a setting this machine can't change: pencilled on the card in place of its value. Waiting for a feature, its jacks
   carry blanking caps and its plug is parked; held at a value, its plug stays seated and can't be moved */
.row .val.pencil{font-size:13.5px;color:#3d3b37;text-shadow:0 0 .6px rgba(53,52,49,.5);transform:rotate(-1.2deg);transform-origin:right center}
.row.held .jk{cursor:default}
.row.held .jk:hover i{box-shadow:0 1px 1px rgba(60,40,10,.4),inset 0 0 0 .5px rgba(0,0,0,.4)}
.row.parked .jacks{position:relative}
.row.parked .jacks::after{content:"";position:absolute;left:0;top:-3px;height:28px;width:var(--tape,0);
  background:linear-gradient(#cbbc94,#d8cba6 45%,#c4b48b);box-shadow:0 1px 2px rgba(60,40,10,.4),inset 0 0 0 .5px rgba(90,70,40,.18);transform:rotate(-.5deg);pointer-events:none;
  clip-path:polygon(0 12%,2% 0,30% 7%,62% 0,98% 6%,100% 0,99% 50%,100% 100%,70% 93%,35% 100%,3% 94%,0 100%,1.5% 50%)}
.row.parked .jk span{color:#8f8571}
.row .band,.row .notice{display:block;margin-top:4px;font-family:var(--type);font-size:12.5px;color:#3d3b37;text-shadow:0 0 .6px rgba(53,52,49,.5)}
.row .band[hidden]{display:none}
.notfitted{margin-top:8px;padding:10px 12px;border:1px dashed rgba(124,35,29,.5);font-family:var(--type);font-size:12.5px;line-height:1.45;color:#5c3a33;background:rgba(124,35,29,.05)}
.card-f{border-top:1.5px solid var(--green-ink);padding:8px 22px 12px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--print);font-size:12px;color:var(--green-ink)}
.card-f b{font-family:var(--type);font-weight:400;color:var(--type-ink);font-size:13px}

/* machine view */
.view{position:relative;min-height:0;min-width:0;overflow:hidden}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.view.grab canvas{cursor:grab}.view.grabbing canvas{cursor:grabbing}
.tag{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);opacity:0;transition:opacity .25s;
  font-family:var(--type);font-size:13px;color:#1c1a16;background:linear-gradient(#efe6cc,#dccfab);padding:5px 10px 4px 18px;border-radius:2px;
  box-shadow:0 4px 12px rgba(0,0,0,.55),inset 0 0 0 1px rgba(110,86,49,.45);white-space:nowrap}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#0b0b0a;box-shadow:0 0 0 1.5px var(--brass)}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:var(--lead,26px);background:rgba(236,230,214,.55)}
.tag.on{opacity:1}
.fullview[hidden]{display:none!important}
.fullview{position:absolute!important;left:16px;top:12px;z-index:3}
.fullview .kb{font-family:var(--type);font-size:12px;letter-spacing:0;color:#9d978a;border:1px solid rgba(236,230,214,.25);padding:0 4px;border-radius:2px;margin-left:2px}
.hint{position:absolute;right:16px;top:12px;background:rgba(11,11,10,.72);padding:4px 9px;border-radius:2px;font-family:var(--type);font-size:12.5px;color:#8d887a;pointer-events:none;transition:opacity .6s}
.fallback{position:absolute;inset:0;display:none;place-items:center;font-family:var(--type);color:#9d978a;padding:40px;text-align:center}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--type);font-size:13px;color:#8d887a;transition:opacity .6s;pointer-events:none}

@media (max-width:980px){
  body{height:auto;overflow:auto}
  .stage{grid-template-columns:1fr;grid-template-rows:56vh auto}
  .view{order:-1;position:sticky;top:0;height:56vh;z-index:1}
  .cardwrap{padding:12px}
  .sched{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.jk[aria-checked="true"] i::after{animation:none}.row .desc{transition:none}}
</style>
</head>
<body>
<div class="top">
  <a class="pl" href="bombechat.html" id="back" aria-label="Back to the front of the machine"><svg width="11" height="9" viewBox="0 0 11 9" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4.5 1 1 4.5 4.5 8M1 4.5h9.5"/></svg>Front of the machine</a>
  <span class="maker">Bombechat<small></small></span>
  <div class="rt"><span class="saved" id="saved" aria-live="polite"></span><span class="pl">Build 0.4</span></div>
</div>

<div class="stage">
  <div class="cardwrap">
    <section class="card" aria-label="Wiring schedule">
      <div class="card-h"><h1>Wiring schedule</h1><span>Machine No.<b>1</b></span></div>
      <div class="sched" id="sched"></div>
      <div class="card-f"><span>Every setting is a plug. Move one here or on the machine.</span></div>
    </section>
  </div>
  <div class="view" id="view">
    <div class="loading" id="loading">warming up the machine</div>
    <div class="tag" id="tag"></div>
    <div class="hint" id="hint">drag a plug to another jack</div>
    <button class="pl fullview" id="fullview" hidden>Full view<span class="kb">Esc</span></button>
    <div class="fallback" id="fallback">This view needs WebGL. Every setting still works from the wiring schedule.</div>
  </div>
</div>

<script type="module">
import { createMachine, engravingFace } from './machine-kit.js';
import { bridge } from './bridge.js';
import { SETTING_ROWS } from './edition.js';

const Q=new URLSearchParams(location.search);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches||Q.has('still');

/* ---------- settings model ---------- */
const GROUPS=['Sound','Light','Bluetooth','Machine','Passing on','Quiet sending','Privacy'];
const SETTINGS=[
 {id:'sound',g:'Sound',name:'Sound switch',values:['Off','Listen','Listen and send'],v:2,desc:'Listen hears messages sent nearby through the microphone. Listen and send also plays yours through the speaker. The same switch as on the front.'},
 {id:'volume',g:'Sound',name:'Send volume',values:['1','2','3','4','5'],v:2,desc:'Louder reaches further across a room, and is easier for others to notice.'},
 {id:'band',g:'Sound',name:'Tone band',values:['Near silent','Audible'],v:0,desc:'Near silent sends on 17.6 to 19.8 kHz. Audible suits older speakers that cannot reach that high.'},
 {id:'light',g:'Light',name:'Light switch',values:['Off','Read','Read and flash'],v:0,desc:'Read watches the camera for a screen flashing a message at it. Read and flash also flashes yours. The same switch as on the front.'},
 {id:'flash',g:'Light',name:'Flash speed',values:['Slow','Normal','Fast'],v:1,desc:'Slower is more reliable in bright rooms and from further away.'},
 {id:'machine',g:'Machine',name:'Machine sound',values:['Off','On'],v:1,desc:'Drum clicks and plug sounds, kept below 7 kHz so they never mix with messages.'},
 {id:'machvol',g:'Machine',name:'Machine volume',values:['1','2','3','4','5'],v:2,desc:'How loud the drums and plugs are.'},
 {id:'carry',g:'Passing on',name:'Carry for others',values:['Off','On'],v:1,desc:'Hold sealed messages for people out of reach and pass them on. You cannot read them.'},
 {id:'hops',g:'Passing on',name:'Hop limit',values:['1','2','3','4','5','6','7'],v:3,desc:'How many devices a message may pass through on its way to someone.'},
 {id:'hold',g:'Passing on',name:'Hold for',values:['1 h','6 h','1 day','3 days','7 days'],v:2,desc:'How long to keep a message for someone before letting it go.'},
 {id:'quiet',g:'Quiet sending',name:'Send under',values:['30','35','40','45','50'],unit:' dB',v:2,desc:'Wait until the room is quieter than this before playing a message.'},
 {id:'repeats',g:'Quiet sending',name:'Repeats',values:['0','1','2','3'],v:2,desc:'Play each message again, a minute and a half apart, in case the first was missed.'},
 {id:'lock',g:'Privacy',name:'Lock with passphrase',values:['Off','On'],v:1,desc:'Ask for your passphrase when Bombechat opens. Contacts and messages are encrypted either way.'},
 {id:'expire',g:'Privacy',name:'Delete messages after',values:['Never','1 day','7 days','30 days'],v:0,desc:'Older messages are erased from this laptop. Counts only time this machine has been running, so they may go later, never sooner.'},
 {id:'inperson',g:'Privacy',name:'New contacts need a key check',values:['Off','On'],v:1,desc:'Only add someone once you have compared keys face to face.'},
 // and the rows this build fits beyond sound and light (edition.js)
 ...SETTING_ROWS,
];
// a group this build has no rows for is a blanking plate: not fitted to this build
const fitted=g=>SETTINGS.some(s=>s.g===g);
const byId=Object.fromEntries(SETTINGS.map(s=>[s.id,s]));
// the machine keeps every setting and is the only record of them: render from it, and send one back only when
// the person changes it. v above is each one's default. A machine that cannot answer leaves every row saying it was
// not read, with Sound and Light at Off rather than their most permissive positions.
function takeKept(kept){const changed=[];for(const s of SETTINGS){if(s.held)continue;const v=kept[s.id];if(Number.isInteger(v)&&v>=0&&v<s.values.length&&(v!==s.v||!s.read)){s.v=v;s.read=true;changed.push(s.id)}}return changed}
SETTINGS.forEach(s=>s.read=true);
try{takeKept(await bridge.settings())}catch(e){SETTINGS.forEach(s=>s.read=false);byId.sound.v=0;byId.light.v=0}
try{localStorage.removeItem('bombechat.settings')}catch(e){}
// the settings this machine can't change, as it says: one waiting for a feature ('comes with relay') has no value and
// its plug is parked; one held at a value ('always, on this build') keeps its plug seated there. Neither can be patched.
// A notice is something the machine has to tell about a setting that still works (the Keychain would not keep the key,
// so the lock is back on): it is written under the row's name until the person sets that setting again.
let NOTES={};try{NOTES=await bridge.settingNotes()||{}}catch(e){}
for(const s of SETTINGS){const n=NOTES[s.id];if(!n)continue;if(n.notice){s.notice=n.note;continue}s.held=n.note;s.parked=!Number.isInteger(n.value);if(!s.parked){s.v=n.value;s.read=true}}
const label=s=>s.held?s.held:s.read?s.values[s.v]+(s.unit||''):'Not read';
const seatedAt=s=>s.parked?-1:s.v;

/* ---------- schedule card ---------- */
const sched=document.getElementById('sched');
const rows={};
for(const g of GROUPS){
  const items=SETTINGS.filter(s=>s.g===g);
  const waits=items.length&&items.every(s=>s.parked);
  const h=document.createElement('div');h.className='grp';h.innerHTML=`<span>${g}</span><small>${!fitted(g)?'not fitted':waits?'plugs parked':items.length+(items.length===1?' plug':' plugs')}</small>`;sched.appendChild(h);
  if(!fitted(g)){const n=document.createElement('div');n.className='notfitted';n.textContent='This build carries no Bluetooth code, so there is nothing here to switch on. The standard build adds discovery and requests to connect from people you have not met.';sched.appendChild(n);continue}
  for(const s of items){
    const r=document.createElement('div');r.className='row'+(s.held?' held':'')+(s.parked?' parked':'');r.dataset.id=s.id;
    const off=s.held?' disabled aria-disabled="true"':'';
    r.innerHTML=`<div class="hd"><span class="nm" id="nm-${s.id}">${s.name}</span><span class="val${s.held?' pencil':''}" id="val-${s.id}">${label(s)}</span></div>
      ${s.id==='band'?'<span class="band" hidden></span>':''}${s.notice?`<span class="notice" id="notice-${s.id}">${s.notice}</span>`:''}<div class="desc">${s.desc}</div>
      <div class="jacks${s.values.some(v=>v.includes(' '))?' wide':''}" role="radiogroup" aria-labelledby="nm-${s.id}"${s.held?` aria-describedby="val-${s.id}" aria-disabled="true"`:s.notice?` aria-describedby="notice-${s.id}"`:''}>${s.values.map((v,i)=>`<button class="jk" role="radio" aria-checked="${i===seatedAt(s)}" tabindex="${i===s.v&&!s.held?0:-1}" data-i="${i}" aria-label="${v}${s.unit||''}"${off}><i></i><span>${v}</span></button>`).join('')}</div>`;
    sched.appendChild(r);rows[s.id]=r;
    r.addEventListener('mouseenter',()=>focusSetting(s.id,'hover'));
    r.addEventListener('mouseleave',()=>focusSetting(null,'hover'));
    // the description opens on keyboard focus only: a press of the mouse focuses the jack too, and a description opening
    // then would push the jacks down under the pointer before it lets go (a click lands, and opens it, as .active)
    r.addEventListener('focusin',e=>{if(keyboardFocus(e.target))r.classList.add('focus');focusSetting(s.id,'focus')});
    r.addEventListener('focusout',()=>{r.classList.remove('focus')});
    r.querySelectorAll('.jk').forEach(b=>{
      b.addEventListener('click',()=>setValue(s.id,+b.dataset.i,'card'));
      b.addEventListener('keydown',e=>{const n=s.values.length;let i=s.v;
        if(e.key==='ArrowRight'||e.key==='ArrowDown')i=(i+1)%n;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')i=(i-1+n)%n;else if(e.key==='Home')i=0;else if(e.key==='End')i=n-1;else return;
        e.preventDefault();setValue(s.id,i,'card');r.querySelectorAll('.jk')[i].focus()})});
  }
}
function keyboardFocus(el){try{return el.matches(':focus-visible')}catch(e){return true}}
// a parked row's tape runs from its first jack to its last
function tapeRows(){for(const s of SETTINGS){if(!s.parked)continue;const j=rows[s.id].querySelectorAll('.jk'),a=j[0].querySelector('i'),b=j[j.length-1].querySelector('i');
  rows[s.id].querySelector('.jacks').style.setProperty('--tape',(b.offsetLeft+b.offsetWidth+8)+'px')}}
tapeRows();new ResizeObserver(tapeRows).observe(sched);
function syncRow(id){const s=byId[id],r=rows[id];r.querySelector('.val').textContent=label(s);
  r.querySelectorAll('.jk').forEach((b,i)=>{b.setAttribute('aria-checked',i===seatedAt(s));b.tabIndex=i===s.v&&!s.held?0:-1});if(id==='band')showBand()}
// Tone band: the band sound is really on. A sound card too slow for near silent stays audible, and the row says so
let soundBand=null;
function showBand(){const el=rows.band&&rows.band.querySelector('.band');if(!el)return;const s=byId.band;
  const short=s.read&&s.v===0&&soundBand==='audible';el.hidden=!short;el.textContent=short?'sending audible: this sound card is too slow for near silent':''}
const savedEl=document.getElementById('saved');let savedT;
function say(text){savedEl.textContent=text;savedEl.style.opacity=1;clearTimeout(savedT);savedT=setTimeout(()=>savedEl.style.opacity=0,text.length>40?5200:2600)}
// the person moved a plug: send it, and if the machine won't take it, put the plug back and say why
function change(id,i){const s=byId[id],was={v:s.v,read:s.read};s.v=i;s.read=true;syncRow(id);say(`${s.name}: ${label(s)}`);
  Object.values(rows).forEach(r=>r.classList.remove('active'));rows[id].classList.add('active');
  Promise.resolve(bridge.setSetting(id,i)).then(()=>{if(s.notice){s.notice=null;rows[id].querySelector('.notice').remove();rows[id].querySelector('.jacks').removeAttribute('aria-describedby')}if(id==='band')bridge.channels().then(list=>list.forEach(onChannel),()=>{})},why=>{if(s.v!==i)return;s.v=was.v;s.read=was.read;syncRow(id);say(String(why&&why.message||why));
    machine&&machine.seat(id,seatedAt(s))})}
function setValue(id,i,from){const s=byId[id];if(s.held){focusSetting(id,'pin');return}if(s.v===i&&s.read){focusSetting(id,'pin');return}change(id,i);

  // the tag stands in the gap between the plug's row and the row above: its foot just over the row's engraved values,
  // its pointer reaching down to the plug, so it never covers the jacks of the row above, however narrow the view
  const toPx=v=>{v.project(camera);return {x:(v.x*.5+.5)*view.clientWidth,y:(-v.y*.5+.5)*view.clientHeight}};
  function updateTag(){if(!focusId){return}const P=plugs[focusId],y=P.jacks[0].y;
    // the gap runs from the foot of the row above's jacks to the top of this row's engraved values: the tag sits in its middle
    const x=P.head.position.x,above=toPx(new THREE.Vector3(x,y+ROWH-.135,.05)).y,values=toPx(new THREE.Vector3(x,y+.28,.05)),plug=toPx(new THREE.Vector3(x,y+.1,.3+P.lift));
    const foot={x:values.x,y:Math.min(values.y-1,(above+values.y)/2+tag.offsetHeight/2)};
    const tw=tag.offsetWidth/2+10;tag.style.left=Math.max(tw,Math.min(view.clientWidth-tw,foot.x))+'px';tag.style.top=foot.y+'px';
    tag.style.setProperty('--lead',Math.max(6,plug.y-foot.y+2)+'px');tag.textContent=tagText(focusId)}
  // what the tag beside a focused plug says: the setting and its value
  const tagText=id=>`${byId[id].name}: ${label(byId[id])}`;

  /* ---------- moving a plug: pull, carry, seat ---------- */
  function move(id,i){const P=plugs[id];if(P.s.held)return;focusSetting(id,'pin');const from=P.end.clone(),to=P.jacks[i].clone();
    if(REDUCED){P.end.copy(to);P.lift=0;rebuild(P);Snd.seat();return}
    P.anim={t0:performance.now(),from,to,pulled:false,seated:false};Snd.pull()}
  // put a plug straight into a jack, quietly: the machine's record moved it, not the person
  function seat(id,i){const P=plugs[id];P.anim=null;P.end.copy(i<0&&P.park?P.park:P.jacks[i]);P.lift=0;rebuild(P)}
  function stepAnim(P,now){const a=P.anim;const t=(now-a.t0)/1000;const PULL=.18,CARRY=.42,SEAT=.16;
    if(t<PULL){const k=t/PULL;P.lift=.45*easeOut(k)}
    else if(t<PULL+CARRY){const k=easeInOut((t-PULL)/CARRY);P.end.copy(a.from).lerp(a.to,k);P.lift=.45+.35*Math.sin(Math.PI*k)}
    else if(t<PULL+CARRY+SEAT){P.end.copy(a.to);const k=(t-PULL-CARRY)/SEAT;P.lift=.45*(1-easeIn(k))}
    else{P.end.copy(a.to);P.lift=0;P.anim=null;Snd.seat();P.liftT=.12;P.kick=performance.now()}
    rebuild(P)}
  const easeOut=k=>1-Math.pow(1-k,3),easeIn=k=>k*k*k,easeInOut=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

  /* ---------- direct manipulation on the machine ---------- */
  const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();const plane=new THREE.Plane(new THREE.Vector3(0,0,1),-.5);let drag=null,hoverId=null;
  function pick(e,list){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);return ray.intersectObjects(list,true)[0]}
  const plugBodies=()=>Object.values(plugs).filter(P=>!P.s.held).map(P=>P.head);
  renderer.domElement.addEventListener('pointermove',e=>{
    if(drag){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);const hitP=new THREE.Vector3();if(ray.ray.intersectPlane(plane,hitP)){
      const P=plugs[drag.id];const x=Math.max(P.jacks[0].x,Math.min(P.jacks[P.jacks.length-1].x,hitP.x));P.end.set(x,P.jacks[0].y,0);P.lift=.5;rebuild(P)}return}
    const h=pick(e,plugBodies())||pick(e,jackMeshes);const look=h||pick(e,[...tapes,...Object.values(plugs).filter(P=>P.s.held).map(P=>P.head)]);
    const id=look?(look.object.userData.id||look.object.parent.userData.id):null;
    view.classList.toggle('grab',!!h);if(id!==hoverId){hoverId=id;if(id)focusSetting(id,'hover');else focusSetting(null,'hover')}});
  renderer.domElement.addEventListener('pointerdown',e=>{const h=pick(e,plugBodies());
    if(h){const id=h.object.userData.id||h.object.parent.userData.id;drag={id};view.classList.add('grabbing');renderer.domElement.setPointerCapture(e.pointerId);focusSetting(id,'pin');Snd.arm();Snd.pull();hideHint();return}
    const j=pick(e,jackMeshes);if(j){setValue(j.object.userData.id,j.object.userData.i,'machine');hideHint();return}
    // anywhere else on the machine: back to the full view
    hoverId=null;fullView()});
  renderer.domElement.addEventListener('pointerup',e=>{if(!drag)return;const P=plugs[drag.id];let best=0,bd=1e9;P.jacks.forEach((p,i)=>{const d=Math.abs(p.x-P.end.x);if(d<bd){bd=d;best=i}});
    const s=byId[drag.id];view.classList.remove('grabbing');const id=drag.id;drag=null;
    P.anim={t0:performance.now()-180,from:P.end.clone(),to:P.jacks[best].clone()};if(s.v!==best||!s.read){change(id,best);rows[id].scrollIntoView({block:'nearest',behavior:'smooth'})}});
  view.addEventListener('pointermove',e=>{const r=view.getBoundingClientRect();parT.x=(e.clientX-r.left)/r.width-.5;parT.y=(e.clientY-r.top)/r.height-.5});
  view.addEventListener('pointerleave',()=>{parT.x=parT.y=0;if(!drag&&hoverId){hoverId=null;focusSetting(null,'hover')}});
  const hint=document.getElementById('hint');function hideHint(){}

  /* ---------- loop ---------- */
  const tmpC=new THREE.Color();let last=performance.now(),frames=0;
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const k=REDUCED?1:1-Math.exp(-dt*3.2);
    pos.lerp(posT,k);look.lerp(lookT,k);par.x+=(parT.x-par.x)*(REDUCED?1:1-Math.exp(-dt*4));par.y+=(parT.y-par.y)*(REDUCED?1:1-Math.exp(-dt*4));
    camera.position.set(pos.x+par.x*(REDUCED?0:.9),pos.y-par.y*(REDUCED?0:.6),pos.z);camera.lookAt(look);
    for(const P of Object.values(plugs)){
      if(P.anim)stepAnim(P,now);
      else if(Math.abs(P.lift-P.liftT)>.002&&!(drag&&drag.id===P.s.id)){P.lift+=(P.liftT-P.lift)*(REDUCED?1:1-Math.exp(-dt*8));rebuild(P)}
      P.dim+=(Math.max(P.dimT,P.rest)-P.dim)*(REDUCED?1:1-Math.exp(-dt*6));tmpC.copy(P.mat.userData.base).multiplyScalar(1-.55*P.dim);P.mat.color.copy(tmpC);P.mat.sheen=.6*(1-P.dim*.7)}
    decorDimNow+=(decorDim-decorDimNow)*(REDUCED?1:1-Math.exp(-dt*5));
    decor.forEach(m=>{if(!m.material.userData.base)m.material.userData.base=m.material.color.clone();m.material.color.copy(m.material.userData.base).multiplyScalar(1-.5*decorDimNow)});
    if(focusId){const P=plugs[focusId];lamp.position.set(P.head.position.x-1.5,P.head.position.y+2.5,4);lamp.target.position.copy(P.head.position);lamp.intensity+=(9-lamp.intensity)*(1-Math.exp(-dt*4))}else lamp.intensity*=Math.exp(-dt*4);
    composer.render();updateTag();
    if(++frames===3){document.getElementById('loading').style.opacity=0;window.__ready=true}
    requestAnimationFrame(frame)}
  requestAnimationFrame(frame);

  function toScreen(v3){const v=v3.clone().project(camera);const r=renderer.domElement.getBoundingClientRect();return {x:r.left+(v.x*.5+.5)*r.width,y:r.top+(-v.y*.5+.5)*r.height}}
  const screen=id=>{const P=plugs[id];const h=P.head.position.clone();h.z+=.35;return {plug:toScreen(h),first:toScreen(P.jacks[0].clone().setZ(.3))}};
  // where a row's jack rings run on screen, top to bottom
  const rowBand=id=>{const P=plugs[id],a=toPx(new THREE.Vector3(P.jacks[0].x,P.jacks[0].y+.135,.05)),b=toPx(new THREE.Vector3(P.jacks[0].x,P.jacks[0].y-.135,.05));const r=renderer.domElement.getBoundingClientRect();return {top:r.top+a.y,bottom:r.top+b.y}};
  // for the README's clip: where a point of the panel lands on the screen, and where a row's parts are on the panel
  const at=(x,y,z)=>toScreen(new THREE.Vector3(x,y,z)),row=id=>{const P=plugs[id];return {name:P.nameX,y:P.src.y,jacks:P.jacks.map(j=>j.x)}};
  return {focus,move,seat,plugs,camera,screen,at,row,rowBand,get ready(){return frames>2},endOf:id=>{const P=plugs[id];return {x:P.end.x,jack:P.jacks.findIndex(j=>Math.abs(j.x-P.end.x)<1e-3&&Math.abs(j.y-P.end.y)<1e-3),lift:P.lift,parked:!!P.park&&P.end.distanceTo(P.park)<1e-3,dim:P.dim}}};
}

/* arriving from the front: finish the turn the front started */
try{if(sessionStorage.getItem('bombechat-turn')==='front-to-back'&&!REDUCED){sessionStorage.removeItem('bombechat-turn');
  document.body.animate([{transform:'perspective(1600px) rotateY(80deg)',opacity:0},{transform:'perspective(1600px) rotateY(0deg)',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.8,.3,1)'})}}catch(e){}
/* tests and links */
// back here by history (bfcache): the settings may have moved on the front, so read them again from the machine
// and show them, sending nothing
addEventListener('pageshow',e=>{if(!e.persisted)return;bridge.settings().then(kept=>{for(const id of takeKept(kept)){syncRow(id);machine&&machine.seat(id,byId[id].v)}},()=>{})});
window.__bc={screen:id=>machine.screen(id),rowBand:id=>machine.rowBand(id),tag:()=>{const r=document.getElementById('tag').getBoundingClientRect();return {top:r.top,bottom:r.bottom,on:document.getElementById('tag').classList.contains('on')}},focused:()=>focusId,get:id=>byId[id].v,held:()=>Object.fromEntries(SETTINGS.filter(s=>s.held).map(s=>[s.id,{note:s.held,parked:!!s.parked}])),set:(id,i)=>setValue(id,i,'test'),focus:id=>focusSetting(id,'pin'),at:(x,y,z)=>machine.at(x,y,z),row:id=>machine.row(id),end:id=>machine&&machine.endOf(id),settings:SETTINGS.map(s=>s.id)};
if(Q.has('focus'))focusSetting(Q.get('focus'),'pin');
document.getElementById('back').addEventListener('click',e=>{if(REDUCED)return;e.preventDefault();const href=e.currentTarget.href;try{sessionStorage.setItem('bombechat-turn','back-to-front')}catch(_){}document.body.animate([{transform:'perspective(1600px) rotateY(0deg)',opacity:1},{transform:'perspective(1600px) rotateY(-80deg)',opacity:0}],{duration:420,easing:'cubic-bezier(.5,0,.75,0)'}).onfinish=()=>location.href=href});
</script>
</body>
