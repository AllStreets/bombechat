[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/modem",
    "crates/light",
    "crates/store",
    "crates/node",
    "crates/session",
    "app/src-tauri",
]
# bluetooth/ is the Bluetooth edition, a separate workspace generated by
# tools/sync-bluetooth.sh; it is never part of the airgapped build.
exclude = ["bluetooth"]

# The modem's signal processing (FFT matched filters, per-sample filtering)
# is slow unoptimised; its sweep tests decode hundreds of seconds of audio.
# Optimise it and its FFT even in dev/test builds.
[profile.dev.package.bombechat-modem]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2

# The light code draws and fountain-codes hundreds of full frames in its
# tests; optimise it and its RaptorQ coder in dev/test builds too.
[profile.dev.package.bombechat-light]
opt-level = 2

[profile.dev.package.raptorq]
opt-level = 2

# The light reader repairs every frame it reads with Reed-Solomon inside a
# time budget; unoptimised, a repair takes several times as long, so the
# budget tests would see a different reader than the app.
[profile.dev.package.reed-solomon]
opt-level = 2

# Argon2id at the production parameters (64 MiB, t=3) is slow unoptimised,
# which would make every store test pay full key-derivation cost in debug
# builds. Optimise just this dependency rather than lowering the KDF cost,
# so dev and release always derive the same key from the same passphrase.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Every session handshake does several curve operations and hashes; the
# session crate's fuzz tests run 100,000 handshake steps. Optimise the
# curve and hash code even in dev/test builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.x25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
