[package]
name = "bombechat-node"
version = "0.1.0"
edition = "2021"

[dependencies]
bombechat-core = { path = "../core" }
bombechat-light = { path = "../light" }
bombechat-modem = { path = "../modem" }
bombechat-store = { path = "../store" }
# GrayImage only, the camera's pictures; no codecs, no I/O.
image = { version = "0.25", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = "2.0.1"
# Not a Bluetooth transport: the canary for the airgapped check's negative
# test. CI builds the tree with `--features bluetooth` and expects
# tools/check-airgapped.sh to fail on btleplug, which proves the check can
# see a Bluetooth crate. Nothing uses it, and neither edition enables it:
# the Bluetooth edition's transport is its own crate in bluetooth/.
btleplug = { version = "0.11", optional = true }

[dev-dependencies]
# FakeAudio / LoopbackAudio for the two-node tests. A dev-dependency only, so
# `fake-audio` never reaches a normal build (tools/check-airgapped.sh follows
# normal edges only).
bombechat-modem = { path = "../modem", features = ["fake-audio"] }
# FakeCamera for the light tests, likewise a dev-dependency only.
bombechat-light = { path = "../light", features = ["fake-camera"] }
rand = "0.8"
tempfile = "3"

[features]
default = []
# The canary above, and nothing else.
bluetooth = ["btleplug"]
