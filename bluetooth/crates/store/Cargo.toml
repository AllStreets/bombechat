[package]
name = "bombechat-store"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
bombechat-core = { path = "../core" }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
